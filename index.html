h1{font-size:clamp(3.2rem,7vw,6.9rem);line-height:.93;letter-spacing:-.05em}
h2{font-size:clamp(2.45rem,5vw,4.7rem);line-height:1;letter-spacing:-.04em}
h3{font-size:1.55rem}
p{margin:0}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;padding:15px 22px;border-radius:999px;border:1px solid transparent;font-weight:800;transition:.25s;cursor:pointer}
.btn.primary{background:linear-gradient(135deg,var(--gold-500),#dfc772);color:var(--blue-950);box-shadow:0 18px 44px rgba(0,0,0,.18)}
.btn.primary:hover{transform:translateY(-2px)}
.btn.secondary{background:rgba(255,255,255,.08);color:white;border-color:rgba(255,255,255,.24);backdrop-filter:blur(8px)}
.btn.secondary:hover{background:rgba(255,255,255,.14)}
.section{padding:105px 0}
.section-head{display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.52fr);gap:56px;align-items:end;margin-bottom:40px}
.section-head p{color:var(--muted);font-size:1rem}
.card{background:white;border:1px solid rgba(18,51,92,.08);border-radius:var(--radius-lg);box-shadow:0 14px 34px rgba(7,20,38,.06)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .75s ease,transform .75s ease}
.reveal.visible{opacity:1;transform:none}
.delay-1{transition-delay:.08s}.delay-2{transition-delay:.16s}.delay-3{transition-delay:.24s}

/* header */
.site-header{position:sticky;top:0;z-index:90;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid rgba(18,51,92,.08)}
nav{height:86px;display:flex;align-items:center;justify-content:space-between;gap:24px}
.brand{display:flex;align-items:center;gap:14px;min-width:max-content}
.brand-mark{width:98px;height:76px;display:grid;place-items:center;padding:10px;border-radius:18px;border:1px solid #d8e3ec;background:linear-gradient(180deg,#ffffff,#f7f9fc);box-shadow:0 10px 24px rgba(7,20,38,.06)}
.brand img{width:100%;height:100%;object-fit:contain}
.brand-copy{padding:10px 16px;border-radius:18px;border:1px solid #e3e8ef;background:linear-gradient(180deg,#ffffff,#fbfcfe);box-shadow:0 8px 20px rgba(7,20,38,.04)}
.brand-copy strong{display:block;font-family:Georgia,serif;font-size:1rem;letter-spacing:.08em;color:var(--blue-950)}
.brand-copy small{display:block;font-size:.58rem;letter-spacing:.25em;color:var(--gold-700);margin-top:3px}
.nav-links{display:flex;gap:28px;font-size:.92rem;font-weight:800;color:#24384d}
.nav-links a{position:relative;padding:28px 0}
.nav-links a::after{content:"";position:absolute;left:0;bottom:21px;width:0;height:2px;background:var(--gold-500);transition:.25s}
.nav-links a:hover::after{width:100%}
.header-cta{display:inline-flex;align-items:center;gap:8px;background:var(--blue-900);color:white;padding:12px 18px;border-radius:999px;font-weight:800}
.menu-btn{display:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:white;color:var(--blue-900);align-items:center;justify-content:center}
.mobile-panel{display:none;position:fixed;top:76px;left:0;right:0;background:white;border-bottom:1px solid var(--line);box-shadow:0 20px 40px rgba(7,20,38,.10);padding:18px 4%;z-index:80;flex-direction:column;gap:10px}
.mobile-panel a{padding:10px 0;border-bottom:1px solid #eef3f7;font-weight:800;color:var(--blue-900)}
.mobile-panel[hidden]{display:none!important}

/* hero */
.hero{position:relative;overflow:hidden;background:
 radial-gradient(circle at 82% 20%, rgba(84,142,198,.32), transparent 26%),
 radial-gradient(circle at 18% 86%, rgba(203,176,90,.16), transparent 24%),
 linear-gradient(130deg,#061426 0%,#0b2340 44%,#144570 100%);color:white;padding:88px 0 64px;min-height:770px}
.hero::before{content:"";position:absolute;left:-280px;top:120px;width:700px;height:700px;border-radius:50%;border:1px solid rgba(255,255,255,.08);box-shadow:0 0 0 90px rgba(255,255,255,.014),0 0 0 180px rgba(255,255,255,.012)}
.hero::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:46px 46px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.95),transparent 90%);pointer-events:none}
.hero-grid{position:relative;z-index:1;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(360px,.72fr);gap:58px;align-items:center}
.hero .eyebrow{color:var(--gold-300)}
.hero-copy{max-width:760px}
.hero h1{margin:18px 0 22px;text-shadow:0 16px 42px rgba(0,0,0,.2)}
.hero .gold{color:#f0da8d;position:relative;white-space:nowrap}
.hero .gold::after{content:"";position:absolute;left:2%;right:0;bottom:-8px;height:10px;background:linear-gradient(90deg,rgba(229,216,161,.55),transparent);border-radius:99px;z-index:-1}
.hero-lead{font-size:1.15rem;color:#d1deea;max-width:720px}
.hero-actions{display:flex;flex-wrap:wrap;gap:12px;margin-top:30px}
.hero-trust{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:34px}
.hero-mini{padding:16px 18px;border-radius:18px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px)}
.hero-mini strong{display:block;font-family:Georgia,serif;font-size:1.3rem;color:#f3e6b8}
.hero-mini span{display:block;font-size:.84rem;color:#d2dfeb;margin-top:5px}
.hero-visual{display:grid;gap:18px;justify-items:end}
.logo-panel{width:min(430px,100%);padding:22px;border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.17),rgba(255,255,255,.06));border:1px solid rgba(255,255,255,.18);backdrop-filter:blur(14px);box-shadow:0 30px 80px rgba(0,0,0,.25)}
.logo-panel-top{background:white;border-radius:26px;padding:26px;display:grid;place-items:center;min-height:320px;position:relative;overflow:hidden}
.logo-panel-top::after{content:"";position:absolute;right:-80px;top:-80px;width:220px;height:220px;border-radius:50%;background:rgba(18,51,92,.05)}
.logo-panel-top img{width:100%;max-width:300px;object-fit:contain;position:relative;z-index:1}
.logo-panel-note{display:grid;gap:10px;padding:18px 20px 0}
.logo-panel-note strong{font-family:Georgia,serif;font-size:1.25rem;color:#f1e4b2}
.logo-panel-note p{color:#d2deea;font-size:.93rem}
.logo-ribbon{width:min(430px,100%);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.ribbon-card{padding:18px 18px;border-radius:20px;background:rgba(6,20,38,.42);border:1px solid rgba(255,255,255,.1)}
.ribbon-card span{display:block;font-size:.75rem;letter-spacing:.12em;text-transform:uppercase;color:#9fc0dd;font-weight:800}
.ribbon-card strong{display:block;margin-top:8px;font-family:Georgia,serif;font-size:1.15rem;color:white}

/* credibility */
.cred-strip{position:relative;margin-top:-32px;z-index:10}
.cred-box{display:grid;grid-template-columns:repeat(4,1fr);background:linear-gradient(110deg,#0d2b4f,#164c7c);border-radius:26px;border:1px solid rgba(255,255,255,.1);overflow:hidden;box-shadow:0 26px 65px rgba(3,16,31,.26)}
.cred-item{padding:24px 26px;min-height:122px}
.cred-item + .cred-item{border-left:1px solid rgba(255,255,255,.12)}
.cred-item strong{display:block;font-family:Georgia,serif;font-size:1.55rem;color:#f0e1a4;line-height:1.05}
.cred-item span{display:block;margin-top:8px;color:#d3dfea;font-size:.86rem}

/* services */
.services{position:relative;overflow:hidden;background:
 radial-gradient(circle at 85% 18%, rgba(52,118,181,.34), transparent 28%),
 radial-gradient(circle at 15% 84%, rgba(203,176,90,.1), transparent 22%),
 linear-gradient(135deg,#06162b 0%,#0b2c51 52%,#123e6b 100%);color:white}
.services::before{content:"";position:absolute;left:-430px;top:120px;width:760px;height:760px;border-radius:50%;border:1px solid rgba(229,216,161,.12);box-shadow:0 0 0 90px rgba(255,255,255,.012),0 0 0 180px rgba(255,255,255,.01)}
.services::after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.028) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.028) 1px,transparent 1px);background-size:48px 48px;mask-image:linear-gradient(to bottom,rgba(0,0,0,.92),transparent 94%);pointer-events:none}
.services .section-head p{color:#bccedd}
.service-marquee{overflow:hidden;border-top:1px solid rgba(255,255,255,.10);border-bottom:1px solid rgba(255,255,255,.10);padding:13px 0;margin:12px 0 34px;mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.service-marquee-track{display:flex;align-items:center;gap:24px;width:max-content;animation:serviceTicker 28s linear infinite;color:#a5bed3;font-size:.68rem;font-weight:900;letter-spacing:.18em;text-transform:uppercase}
.service-marquee-track i{width:5px;height:5px;border-radius:50%;background:var(--gold-500)}
@keyframes serviceTicker{to{transform:translateX(-50%)}}
.service-explorer{position:relative;z-index:1;display:grid;grid-template-columns:minmax(320px,.72fr) minmax(0,1.28fr);gap:20px;align-items:stretch}
.service-menu{padding:10px;background:rgba(2,14,28,.26);border-radius:28px;border:1px solid rgba(255,255,255,.09);backdrop-filter:blur(14px);display:flex;flex-direction:column;gap:8px}
.service-tab{display:grid;grid-template-columns:36px 44px 1fr 26px;gap:12px;align-items:center;min-height:82px;padding:12px 14px;border:1px solid transparent;border-radius:18px;background:transparent;color:#d6e2ec;text-align:left;cursor:pointer;transition:.28s;position:relative;overflow:hidden}
.service-tab:hover{transform:translateX(6px);background:rgba(255,255,255,.05)}
.service-tab.active{transform:translateX(8px);background:linear-gradient(100deg,rgba(255,255,255,.14),rgba(255,255,255,.06));border-color:rgba(229,216,161,.32);box-shadow:0 14px 36px rgba(0,0,0,.14)}
.service-tab.active::after{content:"";position:absolute;left:0;top:13px;bottom:13px;width:3px;border-radius:4px;background:var(--gold-500);box-shadow:0 0 20px rgba(203,176,90,.7)}
.service-tab-num{font-family:Georgia,serif;color:#86a1b7;font-size:.86rem}
.service-tab.active .service-tab-num{color:#eadca7}
.service-tab-icon{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;border:1px solid rgba(255,255,255,.12);background:rgba(255,255,255,.055);font-size:1.05rem;color:#eadca7}
.service-tab b{display:block;font-family:Georgia,serif;font-size:1.05rem;font-weight:500;color:white;line-height:1.15}
.service-tab small{display:block;color:#8ba5bb;margin-top:4px;font-size:.72rem}
.service-tab em{font-style:normal;color:#6f8ca5;transition:.28s}
.service-tab.active em{color:#eadca7;transform:translateX(3px)}
.service-detail{position:relative;min-height:580px;padding:40px 40px 32px;background:linear-gradient(145deg,rgba(255,255,255,.97),rgba(238,245,251,.95));border-radius:32px;border:1px solid rgba(255,255,255,.72);box-shadow:0 34px 90px rgba(0,0,0,.24);color:var(--ink);overflow:hidden;isolation:isolate}
.service-detail::before{content:"";position:absolute;inset:0;background:linear-gradient(125deg,transparent 48%,rgba(18,61,105,.06));z-index:-1}
.service-detail-glow{position:absolute;right:-110px;top:-100px;width:300px;height:300px;border-radius:50%;background:radial-gradient(circle,rgba(35,99,154,.22),rgba(35,99,154,.02) 60%,transparent 72%);transition:.45s ease}
.service-watermark{position:absolute;right:22px;bottom:-38px;font:700 12rem/1 Georgia,serif;color:rgba(18,51,92,.045);letter-spacing:-.08em;user-select:none;transition:.35s;z-index:-1}
.service-detail-top{display:flex;align-items:center;gap:16px;margin-bottom:32px}
.service-symbol{width:68px;height:68px;border-radius:20px;background:linear-gradient(145deg,var(--blue-900),var(--blue-700));display:grid;place-items:center;color:#f0df9d;font-size:1.7rem;box-shadow:0 14px 30px rgba(11,31,58,.22)}
.service-kicker{text-transform:uppercase;letter-spacing:.13em;font-size:.68rem;font-weight:900;color:var(--gold-700)}
.service-status{display:flex;align-items:center;gap:7px;color:#7993a8;font-size:.72rem;margin-top:6px}
.service-status span{width:7px;height:7px;border-radius:50%;background:#4ea272;box-shadow:0 0 0 5px rgba(78,162,114,.12)}
.service-detail h3{font-size:clamp(2.55rem,4.8vw,4.65rem);line-height:.94;letter-spacing:-.04em;color:var(--blue-950);margin-bottom:16px;transition:.32s}
.service-summary{font-size:1.03rem;line-height:1.8;color:#52677a;max-width:760px;min-height:96px}
.service-detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:28px;padding-top:26px;border-top:1px solid #dbe5ed}
.detail-label{display:block;text-transform:uppercase;letter-spacing:.14em;font-size:.74rem;font-weight:900;color:#285bb5;margin-bottom:12px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{padding:8px 13px;border-radius:999px;background:#eef4fb;border:1px solid #d3dfeb;color:#285bb5;font-size:.82rem;font-weight:800}
.service-focus{font-size:.96rem;color:#5d6f80;line-height:1.75}
.service-footer{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-top:30px;padding-top:18px;border-top:1px solid #dbe5ed}
.service-link{display:inline-flex;align-items:center;gap:8px;font-weight:900;font-size:1rem;color:var(--blue-900)}
.service-progress{display:flex;align-items:center;gap:10px;min-width:210px}
.service-progress small{font-size:.72rem;color:#70859a;white-space:nowrap;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.progress-track{position:relative;height:6px;border-radius:999px;background:#d8e4ef;flex:1;overflow:hidden}
.progress-bar{position:absolute;inset:0 auto 0 0;width:16.66%;background:linear-gradient(90deg,var(--blue-700),var(--gold-500));border-radius:999px;transition:width .45s ease}

/* about */
.about{background:linear-gradient(145deg,#f7fafe 0%,#e4eef6 100%)}
.about-grid{display:grid;grid-template-columns:minmax(320px,.8fr) minmax(0,1.2fr);gap:42px;align-items:start}
.about-card{padding:26px;border-radius:30px;background:linear-gradient(160deg,var(--blue-900),var(--blue-700));color:white;box-shadow:var(--shadow);position:relative;overflow:hidden}
.about-card::before{content:"";position:absolute;right:-90px;top:-120px;width:300px;height:300px;border-radius:50%;background:rgba(255,255,255,.06)}
.about-portrait{position:relative;border-radius:24px;overflow:hidden;height:440px;border:1px solid rgba(255,255,255,.14)}
.about-portrait img{width:100%;height:100%;object-fit:cover;object-position:center 28%}
.about-logo-badge{position:absolute;left:16px;top:16px;width:88px;height:74px;background:rgba(255,255,255,.95);border-radius:18px;padding:8px;display:grid;place-items:center;box-shadow:0 10px 26px rgba(0,0,0,.16)}
.about-logo-badge img{max-width:100%;max-height:100%;object-fit:contain}
.about-card h3{font-size:2rem;margin-top:22px}
.about-card p{color:#d8e3ee;margin-top:12px}
.profile-highlights{display:grid;gap:12px;margin-top:24px}
.profile-highlight{padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(4px)}
.profile-highlight b{display:block;font-size:.92rem;letter-spacing:.04em;text-transform:uppercase;color:#f0d596;margin-bottom:6px}
.profile-highlight span{display:block;color:#e6eef6;font-size:.96rem;line-height:1.55}
.profile-quote{margin-top:18px;padding:16px 18px;border-left:3px solid rgba(240,213,150,.9);background:rgba(255,255,255,.06);border-radius:0 18px 18px 0;color:#f2f6fb;font-style:italic;line-height:1.65}
.about-photo-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
.about-photo{border-radius:18px;overflow:hidden;border:1px solid rgba(255,255,255,.12);height:170px}
.about-photo img{width:100%;height:100%;object-fit:cover}
.about-copy .lead{font-size:1.12rem;color:#44576a;max-width:760px}
.value-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:26px 0}
.value-card{padding:20px;border-radius:18px;border:1px solid var(--line);background:white}
.value-card strong{display:block;font-family:Georgia,serif;font-size:1.25rem;color:var(--blue-900)}
.value-card span{display:block;margin-top:6px;color:var(--muted);font-size:.9rem}
.promise{padding:22px 24px;border-radius:22px;background:linear-gradient(135deg,var(--blue-900),var(--blue-750));color:white}
.promise h4{font-size:1.3rem;margin-bottom:10px}
.promise p{color:#d5e0ea}


.essence-quote{margin:24px 0;padding:24px 26px;border-radius:24px;background:linear-gradient(145deg,#ffffff,#f2f7fb);border:1px solid #d7e2ed;box-shadow:0 14px 32px rgba(7,20,38,.06)}
.essence-quote h4{font-size:1rem;letter-spacing:.14em;text-transform:uppercase;color:var(--gold-700);margin-bottom:10px}
.essence-quote p{font-size:1.1rem;line-height:1.8;color:var(--blue-900);margin:0}

/* trajectory */
.trajectory{background:linear-gradient(135deg,#0b2341,#123d69 58%,#0b2d51);color:white;position:relative;overflow:hidden}
.trajectory::before{content:"";position:absolute;right:-250px;top:-240px;width:620px;height:620px;border-radius:50%;border:1px solid rgba(229,216,161,.14);box-shadow:0 0 0 100px rgba(255,255,255,.018)}
.trajectory .section-head p{color:#c5d5e3}
.gallery-grid{display:grid;grid-template-columns:1.2fr 1fr 1fr;grid-auto-rows:240px;gap:18px}
.gallery-card{position:relative;border-radius:24px;overflow:hidden;border:1px solid rgba(255,255,255,.12);box-shadow:0 18px 40px rgba(0,0,0,.18);background:rgba(255,255,255,.08)}
.gallery-card img{width:100%;height:100%;object-fit:cover}
.gallery-card.large{grid-row:span 2}
.gallery-card .overlay{position:absolute;left:0;right:0;bottom:0;padding:22px;background:linear-gradient(180deg,rgba(4,11,18,0) 0%, rgba(4,11,18,.82) 90%)}
.gallery-card b{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#f1e4b2;margin-bottom:6px}
.gallery-card h3{font-size:1.4rem;color:white}
.gallery-card p{margin-top:8px;font-size:.88rem;color:#d5e2ec}

/* cases */
.cases{background:linear-gradient(180deg,#dfeaf3 0%,#edf3f8 100%)}
.case-shell{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(320px,.9fr);gap:22px;align-items:start}
.case-track{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(320px,48%);gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 2px 18px;scrollbar-width:none}
.case-track::-webkit-scrollbar{display:none}
.case-card{scroll-snap-align:start;background:white;border:1px solid var(--line);border-radius:24px;padding:22px;min-height:420px;box-shadow:0 12px 30px rgba(11,31,58,.05);display:flex;flex-direction:column}
.case-figure{position:relative;border-radius:18px;overflow:hidden;min-height:188px;margin-bottom:18px;border:1px solid rgba(18,51,92,.08);background:#dfe8ef}
.case-figure img{width:100%;height:100%;object-fit:cover;display:block}
.case-figure .overlay{position:absolute;left:0;right:0;bottom:0;padding:16px;background:linear-gradient(180deg,rgba(5,12,18,0),rgba(5,12,18,.78))}
.case-figure .overlay b{display:block;font-size:.72rem;letter-spacing:.16em;text-transform:uppercase;color:#f2e4ad;margin-bottom:5px}
.case-figure .overlay p{margin:0;color:#edf4fa;font-size:.84rem;line-height:1.45}
.case-type{font-size:.74rem;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--gold-700)}
.case-card h3{font-size:1.65rem;color:var(--blue-950);margin:12px 0 10px;line-height:1.12}
.case-card p{color:var(--muted);font-size:.93rem;line-height:1.75}
.case-bullets{margin-top:16px;display:grid;gap:10px}
.case-bullets span{display:flex;gap:10px;color:#516477;font-size:.88rem}
.case-bullets i{width:9px;height:9px;border-radius:50%;background:var(--gold-500);margin-top:7px;flex:0 0 auto}
.case-bottom{margin-top:auto;padding-top:16px;border-top:1px solid var(--line);font-size:.82rem;color:#708194}
.case-side{display:grid;gap:18px}
.case-side .photo-stack{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.real-photo{position:relative;border-radius:22px;overflow:hidden;min-height:240px;border:1px solid rgba(18,51,92,.08);box-shadow:0 16px 40px rgba(7,20,38,.08)}
.real-photo.tall{min-height:340px}
.real-photo img{width:100%;height:100%;object-fit:cover}
.real-photo .overlay{position:absolute;left:0;right:0;bottom:0;padding:18px;background:linear-gradient(180deg,rgba(5,12,18,0),rgba(5,12,18,.78))}
.real-photo .overlay b{display:block;font-size:.74rem;letter-spacing:.14em;text-transform:uppercase;color:#f1e4b2}
.real-photo .overlay p{margin-top:6px;color:#e3edf5;font-size:.86rem}
.conf-card{padding:24px;border-radius:24px;background:linear-gradient(145deg,var(--blue-900),var(--blue-700));color:white;box-shadow:var(--shadow)}
.conf-card h3{font-size:1.5rem;margin-bottom:12px}
.conf-card p{color:#d6e2eb}

.success-proof{margin-top:28px;display:grid;gap:18px}
.success-proof-copy{display:grid;grid-template-columns:minmax(240px,.42fr) minmax(0,1fr);gap:22px;align-items:end}
.success-proof-copy h3{margin:0;font-size:1.2rem}
.success-proof-copy p{margin:0;color:var(--muted)}

/* contact */

footer{background:#061120;color:#91a1b3;padding:30px 0;border-top:1px solid rgba(255,255,255,.06)}

/* conversion system */

.conversion-band{background:linear-gradient(135deg,#0d2a4d,#174c7a);color:white;padding:30px 0;border-top:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.08)}

.cta-inline{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:24px 26px;margin-top:28px;border-radius:24px;background:linear-gradient(135deg,#f8fbfe,#e8f1f8);border:1px solid #d6e2ec}
